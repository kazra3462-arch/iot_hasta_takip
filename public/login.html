<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login | Akıllı Hasta Takip</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:'Poppins',sans-serif;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(135deg,#020617,#0f172a,#111827);
      overflow:hidden;
      color:white;
    }

    /* BACKGROUND GLOW */

    .glow1{
      position:absolute;
      width:500px;
      height:500px;
      background:#38bdf820;
      filter:blur(120px);
      border-radius:50%;
      top:-150px;
      left:-120px;
    }

    .glow2{
      position:absolute;
      width:400px;
      height:400px;
      background:#22c55e20;
      filter:blur(120px);
      border-radius:50%;
      bottom:-150px;
      right:-120px;
    }

    /* LOGIN CARD */

    .login-container{
      width:100%;
      max-width:450px;
      padding:20px;
      z-index:10;
    }

    .login-card{
      background:rgba(255,255,255,.05);
      border:1px solid rgba(255,255,255,.08);
      backdrop-filter:blur(14px);
      border-radius:32px;
      padding:45px;
      box-shadow:0 10px 40px rgba(0,0,0,.4);
    }

    .logo{
      text-align:center;
      font-size:60px;
      margin-bottom:15px;
    }

    .title{
      text-align:center;
      font-size:34px;
      font-weight:700;

      background:linear-gradient(to right,#38bdf8,#22c55e);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;

      margin-bottom:12px;
    }

    .subtitle{
      text-align:center;
      color:#cbd5e1;
      line-height:1.7;
      margin-bottom:35px;
      font-size:15px;
    }

    .form-group{
      margin-bottom:22px;
    }

    .form-group label{
      display:block;
      margin-bottom:10px;
      color:#e2e8f0;
      font-size:14px;
    }

    .form-group input{
      width:100%;
      padding:16px;
      border-radius:16px;
      border:1px solid rgba(255,255,255,.08);
      background:rgba(255,255,255,.04);
      color:white;
      outline:none;
      font-size:15px;
      transition:.3s;
    }

    .form-group input:focus{
      border-color:#38bdf8;
      box-shadow:0 0 15px rgba(56,189,248,.25);
    }

    .options{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:25px;
      font-size:14px;
      color:#cbd5e1;
    }

    .options a{
      color:#38bdf8;
      text-decoration:none;
    }

    .options a:hover{
      text-decoration:underline;
    }

    .login-btn{
      width:100%;
      padding:17px;
      border:none;
      border-radius:18px;
      background:linear-gradient(to right,#38bdf8,#22c55e);
      color:white;
      font-size:16px;
      font-weight:600;
      cursor:pointer;
      transition:.3s;
    }

    .login-btn:hover{
      transform:translateY(-3px);
      box-shadow:0 10px 25px rgba(56,189,248,.3);
    }

    .status-boxes{
      display:flex;
      justify-content:space-between;
      gap:12px;
      margin-top:30px;
    }

    .status-card{
      flex:1;
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.06);
      border-radius:18px;
      padding:18px;
      text-align:center;
    }

    .status-card h3{
      color:#38bdf8;
      font-size:20px;
      margin-bottom:5px;
    }

    .status-card p{
      color:#cbd5e1;
      font-size:12px;
    }

    .bottom-text{
      text-align:center;
      margin-top:28px;
      color:#94a3b8;
      font-size:14px;
    }

    .bottom-text a{
      color:#38bdf8;
      text-decoration:none;
    }

    .bottom-text a:hover{
      text-decoration:underline;
    }

    @media(max-width:500px){

      .login-card{
        padding:30px;
      }

      .title{
        font-size:28px;
      }

      .status-boxes{
        flex-direction:column;
      }

    }

  </style>
</head>

<body>

<div class="glow1"></div>
<div class="glow2"></div>

<div class="login-container">

  <div class="login-card">

    <div class="logo">
      ❤️
    </div>

    <h1 class="title">
      Hasta Takip Girişi
    </h1>

    <p class="subtitle">
      IoT destekli sağlık sistemine erişin,
      hasta verilerini canlı takip edin.
    </p>

    <form onsubmit="login(event)">

      <div class="form-group">
        <label>E-Posta</label>
        <input type="email" id="email" placeholder="mail@example.com">
      </div>

      <div class="form-group">
        <label>Şifre</label>
        <input type="password" id="password" placeholder="Şifrenizi girin">
      </div>

      <div class="options">

        <label>
          <input type="checkbox">
          Beni Hatırla
        </label>

        <a href="#">Şifremi Unuttum</a>

      </div>

      <button class="login-btn" type="submit">
        🔐 Giriş Yap
      </button>
<button
  class="login-btn"
  type="button"
  onclick="fingerprintLogin()"
  style="margin-top:15px;">

  👆 Parmak İzi ile Giriş

</button>
    </form>

    <div class="status-boxes">

      <div class="status-card">
        <h3>LIVE</h3>
        <p>Canlı Veri</p>
      </div>

      <div class="status-card">
        <h3>ESP32</h3>
        <p>IoT Destek</p>
      </div>

      <div class="status-card">
        <h3>24/7</h3>
        <p>Hasta Takibi</p>
      </div>

    </div>

    <div class="bottom-text">
      Hesabın yok mu?
      <a href="register.html">Kayıt Ol</a>
    </div>

  </div>

</div>

<script>

function login(event){

  event.preventDefault();

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  if(email === "" || password === ""){

    alert("❌ Tüm alanları doldurun.");
    return;
  }

  alert("✅ Giriş başarılı!");

  window.location.href = "home.html";
}
async function fingerprintLogin(){

  alert("👆 Parmak izinizi okutun");

  setTimeout(() => {

    alert("✅ Parmak izi doğrulandı");
    window.location.href = "home.html";

  }, 1000);

}
</script>

</body>
</html>
