<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kayıt Ol | Akıllı Hasta Takip</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:'Poppins',sans-serif;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(135deg,#020617,#0f172a,#111827);
      overflow:hidden;
      color:white;
      padding:20px;
    }

    /* BACKGROUND */

    .glow1{
      position:absolute;
      width:500px;
      height:500px;
      background:#38bdf820;
      filter:blur(120px);
      border-radius:50%;
      top:-150px;
      left:-120px;
    }

    .glow2{
      position:absolute;
      width:400px;
      height:400px;
      background:#22c55e20;
      filter:blur(120px);
      border-radius:50%;
      bottom:-150px;
      right:-120px;
    }

    /* REGISTER CARD */

    .register-container{
      width:100%;
      max-width:500px;
      z-index:10;
    }

    .register-card{
      background:rgba(255,255,255,.05);
      border:1px solid rgba(255,255,255,.08);
      backdrop-filter:blur(14px);
      border-radius:32px;
      padding:45px;
      box-shadow:0 10px 40px rgba(0,0,0,.4);
    }

    .logo{
      text-align:center;
      font-size:60px;
      margin-bottom:15px;
    }

    .title{
      text-align:center;
      font-size:34px;
      font-weight:700;

      background:linear-gradient(to right,#38bdf8,#22c55e);
      -webkit-background-clip:text;
      -webkit-text-fill-color:transparent;

      margin-bottom:12px;
    }

    .subtitle{
      text-align:center;
      color:#cbd5e1;
      line-height:1.7;
      margin-bottom:35px;
      font-size:15px;
    }

    .form-group{
      margin-bottom:22px;
    }

    .form-group label{
      display:block;
      margin-bottom:10px;
      color:#e2e8f0;
      font-size:14px;
    }

    .form-group input,
    .form-group select{
      width:100%;
      padding:16px;
      border-radius:16px;
      border:1px solid rgba(255,255,255,.08);
      background:rgba(255,255,255,.04);
      color:white;
      outline:none;
      font-size:15px;
      transition:.3s;
    }

    .form-group input:focus,
    .form-group select:focus{
      border-color:#38bdf8;
      box-shadow:0 0 15px rgba(56,189,248,.25);
    }

    .register-btn{
      width:100%;
      padding:17px;
      border:none;
      border-radius:18px;
      background:linear-gradient(to right,#38bdf8,#22c55e);
      color:white;
      font-size:16px;
      font-weight:600;
      cursor:pointer;
      transition:.3s;
      margin-top:10px;
    }

    .register-btn:hover{
      transform:translateY(-3px);
      box-shadow:0 10px 25px rgba(56,189,248,.3);
    }

    .bottom-text{
      text-align:center;
      margin-top:28px;
      color:#94a3b8;
      font-size:14px;
    }

    .bottom-text a{
      color:#38bdf8;
      text-decoration:none;
    }

    .bottom-text a:hover{
      text-decoration:underline;
    }

    .status-boxes{
      display:flex;
      justify-content:space-between;
      gap:12px;
      margin-top:30px;
    }

    .status-card{
      flex:1;
      background:rgba(255,255,255,.04);
      border:1px solid rgba(255,255,255,.06);
      border-radius:18px;
      padding:18px;
      text-align:center;
    }

    .status-card h3{
      color:#38bdf8;
      font-size:20px;
      margin-bottom:5px;
    }

    .status-card p{
      color:#cbd5e1;
      font-size:12px;
    }

    @media(max-width:550px){

      .register-card{
        padding:30px;
      }

      .title{
        font-size:28px;
      }

      .status-boxes{
        flex-direction:column;
      }

    }

  </style>
</head>

<body>

<div class="glow1"></div>
<div class="glow2"></div>

<div class="register-container">

  <div class="register-card">

    <div class="logo">
      🩺
    </div>

    <h1 class="title">
      Hesap Oluştur
    </h1>

    <p class="subtitle">
      Akıllı hasta takip sistemine kayıt olun,
      sağlık verilerini gerçek zamanlı yönetin.
    </p>

    <form onsubmit="register(event)">

      <div class="form-group">
        <label>Ad Soyad</label>
        <input type="text" id="fullname" placeholder="Adınızı girin">
      </div>

      <div class="form-group">
        <label>E-Posta</label>
        <input type="email" id="email" placeholder="mail@example.com">
      </div>

      <div class="form-group">
        <label>Departman</label>

        <select id="department">
          <option>Yoğun Bakım</option>
          <option>Kardiyoloji</option>
          <option>Acil Servis</option>
          <option>Nöroloji</option>
        </select>
      </div>

      <div class="form-group">
        <label>Şifre</label>
        <input type="password" id="password" placeholder="Şifre oluşturun">
      </div>

      <div class="form-group">
        <label>Şifre Tekrar</label>
        <input type="password" id="confirmPassword" placeholder="Şifreyi tekrar girin">
      </div>

      <button class="register-btn" type="submit">
        🚀 Hesap Oluştur
      </button>

    </form>

    <div class="status-boxes">

      <div class="status-card">
        <h3>LIVE</h3>
        <p>Canlı Veri</p>
      </div>

      <div class="status-card">
        <h3>ESP32</h3>
        <p>IoT Sistem</p>
      </div>

      <div class="status-card">
        <h3>24/7</h3>
        <p>Hasta Takibi</p>
      </div>

    </div>

    <div class="bottom-text">
      Zaten hesabın var mı?
      <a href="login.html">Giriş Yap</a>
    </div>

  </div>

</div>

<script>

function register(event){

  event.preventDefault();

  const fullname = document.getElementById("fullname").value;
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const confirmPassword = document.getElementById("confirmPassword").value;

  if(
    fullname === "" ||
    email === "" ||
    password === "" ||
    confirmPassword === ""
  ){
    alert("❌ Lütfen tüm alanları doldurun.");
    return;
  }

  if(password !== confirmPassword){
    alert("❌ Şifreler eşleşmiyor.");
    return;
  }

  alert("✅ Hesap başarıyla oluşturuldu!");

  window.location.href = "login.html";
}

</script>

</body>
</html>
